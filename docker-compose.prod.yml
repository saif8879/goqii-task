# Production stack. Used on its own, not as an override of docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# There is no database service here. Production runs against a managed MySQL
# instance (RDS), so the database outlives the host, and the roughly 400 MB a
# MySQL container would want stays available on a 1 GB box. Every connection
# value therefore has to be supplied; nothing is defaulted to localhost, since
# a silent fallback to the wrong database is worse than a refusal to start.
#
# The development file still runs MySQL in a container. That difference is the
# point: local work needs a throwaway database, production must not have one.

services:
  api:
    build: ./api
    container_name: taskmanager-api
    restart: unless-stopped
    environment:
      DB_HOST: "${DB_HOST:?set DB_HOST to the database endpoint}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:?set DB_NAME in .env}"
      DB_USER: "${DB_USER:?set DB_USER in .env}"
      DB_PASS: "${DB_PASS:?set DB_PASS in .env}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      # Credentialed CORS forbids a wildcard, so this has to be the front end's
      # exact origin. No default: a wrong value here fails at runtime in a way
      # that is tedious to diagnose from the browser.
      CORS_ORIGIN: "${CORS_ORIGIN:?set CORS_ORIGIN to the front end's exact origin}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-Lax}"
    ports:
      # Loopback only. nginx terminates TLS on the host and proxies here, so
      # the API is never directly reachable from the network.
      #
      # Not 8080: nginx publishes the API on 8080 itself, and it cannot bind
      # 0.0.0.0:8080 while a container holds 127.0.0.1:8080.
      - "127.0.0.1:${API_PORT:-9000}:80"
