# Front end and API on a single origin.
#
# Serving both from here is what keeps authentication simple: the refresh
# cookie is SameSite=Lax and scoped to /api/auth, so putting the API on a
# separate host would force SameSite=None plus a CORS allowlist entry. A local
# proxy hop avoids both.
#
# Install as /etc/nginx/sites-available/goqii, symlinked into sites-enabled,
# with the packaged default site removed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Matched by default rather than by name. The certificate is issued for an
    # IP address that is not an Elastic IP, so the address can change; keeping
    # server_name out of it means only the certificate paths below need editing
    # when it does.
    server_name _;

    # Has to stay reachable for certbot's HTTP-01 renewal, which is why the
    # redirect below does not cover it. A Let's Encrypt IP certificate is valid
    # for 160 hours, so a broken challenge path takes the site down in six days
    # rather than three months.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Reissued every few days by the certbot timer. The path is keyed on the IP
    # address, so a new public IP means reissuing and editing these two lines.
    ssl_certificate     /etc/letsencrypt/live/13.48.104.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.48.104.49/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/goqii;
    index index.html;

    # The /api prefix is part of the application's own routes, and the refresh
    # cookie is scoped to /api/auth, so the path must arrive unchanged. A
    # proxy_pass without a URI component passes it through as-is; adding even a
    # trailing slash here would strip the prefix and 404 every route.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits hashed filenames here, so these are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # History fallback. Without this a reload on /login returns 404 instead of
    # letting the router resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
