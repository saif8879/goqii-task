# Front end and API, served over TLS on three ports.
#
#   443   both, same origin (front end at /, API under /api)
#   5173  front end only
#   8080  API only
#
# 5173 and 8080 mirror the ports the application uses in local development, and
# the security group is already open for them. They are still HTTPS: a
# certificate is bound to a host, not a port, so the IP certificate issued for
# this instance covers all three. Serving them over plain HTTP instead would
# force COOKIE_SECURE=false, and the refresh cookie would stop surviving a
# reload.
#
# The front end reaches the API cross-origin at :8080, which is what the
# application was designed for: it sends credentials: 'include', and the API
# echoes an Origin only when it appears in the CORS_ORIGIN allowlist. Different
# ports are a different origin for CORS, but the same site for cookies, so
# SameSite=Lax is still correct.
#
# Install as /etc/nginx/sites-available/goqii and symlink into sites-enabled.

# The API container publishes here, on loopback only. nginx owns the public
# 8080, so the container cannot use it.
upstream taskmanager_api {
    server 127.0.0.1:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Matched by default rather than by name. The certificate is issued for an
    # IP address that is not an Elastic IP, so the address can change; keeping
    # server_name out of it means only the certificate paths need editing when
    # it does.
    server_name _;

    # Has to stay reachable for certbot's HTTP-01 renewal, which is why the
    # redirect below does not cover it. A Let's Encrypt IP certificate is valid
    # for 160 hours, so a broken challenge path takes the site down in six days
    # rather than three months.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The certificate paths are repeated in each server block below. They are
# reissued every few days by the certbot timer, and keyed on the IP address, so
# a new public IP means reissuing and editing all three.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/13.48.104.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.48.104.49/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/goqii;
    index index.html;

    # Same-origin path to the API, kept because it costs nothing and is handy
    # for probing the backend directly. The /api prefix belongs to the
    # application's routes and the refresh cookie is scoped to /api/auth, so it
    # must arrive unchanged: a proxy_pass without a URI component passes the
    # path through as-is, while adding even a trailing slash would strip it.
    location /api/ {
        proxy_pass http://taskmanager_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Front end.
server {
    listen 5173 ssl;
    listen [::]:5173 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/13.48.104.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.48.104.49/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/goqii;
    index index.html;

    # Vite emits hashed filenames here, so these are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # History fallback. Without this a reload on /login returns 404 instead of
    # letting the router resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API.
server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/13.48.104.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.48.104.49/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Everything here belongs to the API, including the OPTIONS preflights the
    # browser sends before credentialed cross-origin requests. CORS headers come
    # from the application, which matches the Origin against its allowlist;
    # adding them here as well would produce duplicates and browsers reject a
    # response carrying two Access-Control-Allow-Origin headers.
    location / {
        proxy_pass http://taskmanager_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
